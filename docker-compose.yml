services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vlearn
      POSTGRES_PASSWORD: vlearn
      POSTGRES_DB: vlearn
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlearn"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      STORAGE: postgres
      CHECKPOINTER: redis
      VECTOR_BACKEND: qdrant
      DUMP_FIRST: "true"
      LLM_PROBE: "true"
      DATABASE_URL: postgresql+asyncpg://vlearn:vlearn@postgres:5432/vlearn
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
