# Danh mục 6 buổi học của khoá (chỉ metadata do nhóm tự viết: tên buổi, tên mục,
# mã đoạn). NGUYÊN VĂN bài giảng nằm ở codebase/data/chunks.local.json hoặc bảng
# lecture_chunks trên Supabase — cả hai đều KHÔNG commit.
#
# Sinh lại phần thân bài (đọc được trên giao diện) bằng:
#   python codebase/scripts/build_lessons.py --pack "<đường dẫn>/data/vlearn-pack"

lessons:
  day01-foundation-a:
    order: 1
    title: "Nền tảng AI và mô hình ngôn ngữ lớn"
    day: "Day 1 · Buổi 1"
    subtitle: "Từ lịch sử AI đến cách LLM đoán token, context và cách gọi API"
    transcript_files: [transcript-04-clean.md]
    concepts: [context_window, temperature, multi_head]
    tags: [foundation, llm]

  day01-foundation-b:
    order: 2
    title: "Transformer và cơ chế self-attention"
    day: "Day 1 · Buổi 2"
    subtitle: "Trái tim của LLM: token → vector → self-attention → dự đoán token kế tiếp"
    transcript_files: [transcript-06-clean.md]
    concepts: [self_attention, transformer, token, vector, similarity, hallucination]
    tags: [foundation, transformer]

  day02-problem-scoping:
    order: 3
    title: "Xác định bài toán kinh doanh cho AI"
    day: "Day 2 · Sáng"
    subtitle: "Từ yêu cầu mơ hồ đến vấn đề thật: Double Diamond, Five Whys, ma trận tác động – nỗ lực"
    transcript_files: [transcript-01-clean.md]
    concepts: [double_diamond, impact_effort]
    tags: [product, discovery]

  day02-metrics-automation:
    order: 4
    title: "Chỉ số thành công và mức tự động hoá"
    day: "Day 2 · Sáng (phần sau)"
    subtitle: "North Star Metric, A/B test, automation và augmentation"
    transcript_files: [transcript-02-clean.md]
    concepts: [north_star, automation_augmentation]
    tags: [product, metrics]

  day02-constraints:
    order: 5
    title: "Soi bài toán, tự động hoá và ràng buộc kỹ thuật"
    day: "Day 2 · Chiều"
    subtitle: "Khi nào LLM không đủ, tool calling, RAG nội bộ và phạm vi vận hành (ODD)"
    transcript_files: [transcript-03-clean.md]
    concepts: [tool_calling, odd_scope]
    tags: [engineering, risk]

  day02-eval-data:
    order: 6
    title: "Bài toán, đánh giá và dữ liệu"
    day: "Day 2 · Buổi tổng hợp"
    subtitle: "Vòng đời sản phẩm AI, problem statement và ba mức giải pháp"
    transcript_files: [transcript-05-clean.md]
    concepts: [problem_statement, solution_levels]
    tags: [product, evaluation]

